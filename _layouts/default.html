<!DOCTYPE html>
<html lang="zh-CN">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    <header class="mobile-topbar">
      <a class="mobile-brand topbar-brand" href="{{ '/' | relative_url }}">{{ site.name }}</a>
      <div class="mobile-topbar-actions topbar-actions">
        <button class="icon-button topbar-search topbar-button" type="button" data-search-open aria-haspopup="dialog" aria-label="搜索文章" title="搜索文章">
          {% include icons.html name='search' %}
        </button>
        <button class="icon-button topbar-theme topbar-button" id="mobile-theme-toggle" type="button" data-theme-toggle aria-label="切换主题" title="切换主题">
          {% include icons.html name='moon' %}{% include icons.html name='sun' %}
        </button>
        <button id="menu-toggle" class="icon-button topbar-button" type="button" aria-controls="site-sidebar" aria-expanded="false" aria-label="打开菜单" title="打开菜单">
          {% include icons.html name='menu' %}
        </button>
      </div>
    </header>

    <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true" hidden></div>
    {% include nav.html %}

    <main id="main" tabindex="-1" class="wrapper-content{% if page.toc == true %} withtoc{% endif %}">
      <div class="container">{{ content }}</div>
    </main>

    <footer class="site-footer">{% include footer.html %}</footer>

    <div class="floating-buttons">
      <button id="back-to-top" class="icon-button" type="button" aria-label="返回顶部" title="返回顶部" hidden>{% include icons.html name='up' %}</button>
      <button id="sidebar-toggle" class="icon-button" type="button" aria-label="进入专注模式" title="进入专注模式" aria-expanded="true" aria-controls="site-sidebar">{% include icons.html name='panel' %}</button>
    </div>

    {% include analytics.html %}
    <script src="{{ '/js/theme-switcher.js' | relative_url }}" defer></script>
    <script src="{{ '/js/layout.js' | relative_url }}" defer></script>
    <script src="{{ '/js/search.js' | relative_url }}" defer></script>
    {% if page.layout == 'post' %}
      <script src="{{ '/js/reading-progress.js' | relative_url }}" defer></script>
      <script src="{{ '/js/code-enhancements.js' | relative_url }}" defer></script>
      <script src="{{ '/js/image-zoom.js' | relative_url }}" defer></script>
      <script src="{{ '/js/toc.js' | relative_url }}" defer></script>
      <script src="{{ '/js/giscus.js' | relative_url }}" defer></script>
    {% endif %}
    <script src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js" defer></script>
  </body>
</html>
