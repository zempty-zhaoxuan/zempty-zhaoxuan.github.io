{% if site.google_analytics %}
  <script src="{{ '/js/analytics.js' | relative_url }}" data-id="{{ site.google_analytics | escape }}" data-page-path="{{ site.baseurl | append: page.url | escape }}" data-page-title="{{ page.title | default: '' | escape }}" defer></script>
  <script src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics | url_encode }}" defer></script>
{% endif %}
