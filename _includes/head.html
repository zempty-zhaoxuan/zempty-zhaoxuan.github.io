<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbfbfa">
  <script>
    (function () {
      var theme = null;
      try {
        var stored = localStorage.getItem('theme');
        var legacy = localStorage.getItem('theme-preference');
        var normalize = function (value) {
          if (value === 'light' || value === 'light-theme') return 'light';
          if (value === 'dark' || value === 'dark-theme') return 'dark';
          return null;
        };
        theme = normalize(stored) || normalize(legacy);
        if (theme && (stored !== theme || legacy !== null)) {
          localStorage.setItem('theme', theme);
          localStorage.removeItem('theme-preference');
        }
      } catch (e) { /* Storage can be unavailable in private browsing. */ }
      if (!theme) {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.add(theme + '-theme');
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#111315' : '#fbfbfa';
    })();
  </script>
  <title>{% if page.title %}{{ page.title | escape }} – {{ site.name | escape }}{% else %}{{ site.name | escape }} – {{ site.description | escape }}{% endif %}</title>

  {% include meta.html %}

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://giscus.app https://busuanzi.ibruce.info; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src https://giscus.app; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://busuanzi.ibruce.info; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests">

  <meta name="base-url" content="{{ site.baseurl }}" />
  <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>
  <link rel="preconnect" href="https://www.google-analytics.com" crossorigin>

  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">

  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link
    rel="alternate"
    type="application/rss+xml"
    title="{{ site.name }} - {{ site.description }}"
    href="{{ site.baseurl }}/feed.xml"
  />
  <link rel="shortcut icon" href="{{ site.favicon }}" />
</head>
